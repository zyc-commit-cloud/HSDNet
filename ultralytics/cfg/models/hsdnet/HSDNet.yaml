# Ultralytics YOLO 🚀, AGPL-3.0 license
# Hyper-YOLO object detection model with N3-N5 outputs.

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=hyper-yolon.yaml' will call hyper-yolo.yaml with scale 'n'
  # [depth, width, max_channels, threshold]
#  n: [0.33, 0.25, 1024, 6]
#  s: [0.33, 0.50, 1024, 8]
  m: [0.67, 0.75, 768, 10]
#  l: [1.00, 1.00, 512, 10]
#  x: [1.00, 1.25, 512, 12]

# Hyper-YOLO backbone
backbone:
    - [ -1, 1, Conv, [ 64, 3, 2 ] ]  # 0-B1/2
    - [ -1, 1, Conv, [ 128, 3, 2 ] ] # 1
    - [ -1, 3, DPFE, [ 128, True, 2, 3 ] ] # 2-B2/4（浅层：小目标特征核心层）
    - [ -1, 1, Conv, [ 256, 3, 2 ] ] # 3
    - [ -1, 6, DPFE, [ 256, True, 2, 5 ] ] # 4-B3/8（中层：扩大感受野）
    - [ -1, 1, Conv, [ 512, 3, 2 ] ] # 5
    - [ -1, 6, MANet, [ 512, True, 2, 5 ] ] # 6-B4/16（特征连续性保持）
    - [ -1, 1, Conv, [ 1024, 3, 2 ] ] # 7-P5/32
    - [ -1, 3, MANet, [ 1024, True, 2, 3 ] ] # 8（深层：降低计算量）
    - [ -1, 1, SPPF, [ 1024, 5 ] ] # 9-B5/32

# Hyper-YOLO head
head:
  # Semantic Collecting
  - [0, 1, nn.AvgPool2d, [8, 8, 0]] # 10
  - [2, 1, nn.AvgPool2d, [4, 4, 0]] # 11
  - [4, 1, nn.AvgPool2d, [2, 2, 0]] # 12
  - [9, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[10, 11, 12, 6, 13], 1, Concat, [1]]  # cat 14

  # Hypergraph Computation
  - [-1, 1, Conv, [512, 1, 1]] # 15
  - [-1, 1, HyperComputeModule, [512]] # 16
  - [-1, 3, MANet, [512, True, 2, 3]] # 17

  - [[-1, 6], 1, Concat, [1]]  # cat  18 40
  - [-1, 3, MANet, [512, False, 2, 3]]  #  19 40

  - [17, 1, nn.Upsample, [None, 2, 'nearest']] #  20  80
  - [[-1, 4], 1, Concat, [1]]  # cat 21 80
  - [-1, 3, MANet, [256, False, 2, 3]]  #  22  80

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] #23 160
  - [[-1, 2], 1, Concat, [1]]  #  24 160
  - [-1, 3, MANet, [128, False, 2, 3]]  #  25 160

  - [-1, 1, Conv, [128, 3, 2]] # 26  80
  - [[-1, 22], 1, Concat, [1]]  # 27 80
  - [-1, 3, MANet, [256, False, 2, 3]]  #  4 28 80

  - [-1, 1, Conv, [256, 3, 2]] #  29 40
  - [[-1, 19], 1, Concat, [1]]  #  30 40
  - [-1, 3, MANet, [512, False, 2, 3]]  # 31 40


  - [[25, 28, 31], 1, Detect, [nc]]  # Detect(N3, N4, N5)